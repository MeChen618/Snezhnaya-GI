name: Build and protocol tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libclang-dev protobuf-compiler
      - name: Validate resource setup and launcher syntax
        run: |
          python3 -m py_compile scripts/setup_resources.py
          bash -n scripts/start.sh
      - name: Protocol regression tests
        run: cargo test --locked -p snezhnaya-gi-proto --lib
      - name: Build servers and smoke client
        run: cargo build --locked --workspace --examples --bins
